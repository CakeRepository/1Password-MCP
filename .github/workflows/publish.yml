name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Runs dependency code (npm ci, build, tests) with a read-only token and no
  # OIDC access, then hands the packed tarball to the publish job.
  build:
    name: Build, test, and pack
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    outputs:
      package_name: ${{ steps.pack.outputs.package_name }}
      package_version: ${{ steps.pack.outputs.package_version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      # Dependency install scripts never run in the job that builds the
      # published tarball; build and tests do not need them.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate version alignment
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          SERVER_VERSION=$(node -p "require('./server.json').version")
          CONFIG_VERSION=$(node -e "const fs=require('fs'); const s=fs.readFileSync('./src/config.ts','utf8'); const m=s.match(/export const SERVER_VERSION = \"([^\"]+)\";/); if(!m){process.exit(1)}; console.log(m[1]);")

          echo "package.json version: ${PACKAGE_VERSION}"
          echo "server.json version: ${SERVER_VERSION}"
          echo "src/config.ts version: ${CONFIG_VERSION}"

          if [ "${PACKAGE_VERSION}" != "${SERVER_VERSION}" ] || [ "${PACKAGE_VERSION}" != "${CONFIG_VERSION}" ]; then
            echo "Version mismatch detected. Ensure package.json, server.json, and src/config.ts are identical."
            exit 1
          fi

      - name: Validate release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          EXPECTED_TAG="v${PACKAGE_VERSION}"

          echo "release tag: ${RELEASE_TAG}"
          echo "expected tag: ${EXPECTED_TAG}"

          if [ "${RELEASE_TAG}" != "${EXPECTED_TAG}" ]; then
            echo "Release tag does not match package version."
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Pack npm tarball
        id: pack
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          # Pack into a fresh directory so the new tarball is the only .tgz
          # there, whatever npm names it, then give it a fixed name.
          PACK_DIR=$(mktemp -d)
          npm pack --ignore-scripts --pack-destination "${PACK_DIR}"

          set -- "${PACK_DIR}"/*.tgz
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "Expected exactly one tarball from npm pack."
            exit 1
          fi
          mv "$1" package.tgz
          echo "Packed ${PACKAGE_NAME}@${PACKAGE_VERSION} as package.tgz"

          echo "package_name=${PACKAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "package_version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload npm package artifact
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: package.tgz
          if-no-files-found: error
          retention-days: 1

  # The only job with OIDC access (npm trusted publishing). It never checks out
  # the repository or installs/runs dependency code; it only publishes the
  # tarball built above.
  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify trusted-publishing toolchain
        run: |
          node --version
          npm --version
          node -e "const [major, minor] = process.versions.node.split('.').map(Number); if (major < 22 || (major === 22 && minor < 14)) process.exit(1)"
          npm install --global npm@latest
          npm --version
          node -e "const { execSync } = require('child_process'); const version = execSync('npm --version', { encoding: 'utf8' }).trim().split('.').map(Number); if (version[0] < 11 || (version[0] === 11 && version[1] < 5) || (version[0] === 11 && version[1] === 5 && version[2] < 1)) process.exit(1)"

      - name: Download npm package artifact
        uses: actions/download-artifact@v8
        with:
          name: npm-package

      - name: Check if version already exists on npm
        id: npm_check
        env:
          PACKAGE_NAME: ${{ needs.build.outputs.package_name }}
          PACKAGE_VERSION: ${{ needs.build.outputs.package_version }}
        run: |
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "Version ${PACKAGE_VERSION} is already published. Skipping publish."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "Version ${PACKAGE_VERSION} is not published yet."
          fi

      - name: Publish to npm with OIDC
        if: steps.npm_check.outputs.already_published == 'false'
        run: npm publish ./package.tgz --access public --ignore-scripts
