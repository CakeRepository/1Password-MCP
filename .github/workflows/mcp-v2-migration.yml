# One-time runner; remove after the generated migration lands.
name: MCP v2 migration

on:
  workflow_dispatch:
  issue_comment:
    types: [created]
  push:
    branches: [master]
    paths:
      - .github/workflows/mcp-v2-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.event_name != 'issue_comment' || (github.event.issue.pull_request && github.event.comment.body == '/run-mcp-v2-migration')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/mcp-2026-07-28

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Run official MCP v1 to v2 codemod
        run: npx --yes @modelcontextprotocol/codemod@2.0.0-beta.5 v1-to-v2 .

      - name: Enable 2026-07-28 and legacy stdio negotiation
        run: |
          cat > src/index.ts <<'EOF'
          /**
           * 1Password MCP Server — main entrypoint.
           *
           * Builds one server instance per stdio connection and lets the MCP v2
           * transport negotiate either protocol revision 2026-07-28 or a legacy
           * 2025-era connection.
           */

          import { McpServer } from "@modelcontextprotocol/server";
          import { serveStdio } from "@modelcontextprotocol/server/stdio";
          import { SERVER_NAME, SERVER_VERSION, getConfig } from "./config.js";
          import { log, logError } from "./logger.js";
          import { registerAllTools } from "./tools/index.js";
          import { registerAllPrompts } from "./prompts/index.js";
          import { registerAllResources } from "./resources/index.js";

          export function buildServer(): McpServer {
            const server = new McpServer({
              name: SERVER_NAME,
              version: SERVER_VERSION,
            });

            registerAllTools(server);
            registerAllPrompts(server);
            registerAllResources(server);

            return server;
          }

          process.on("uncaughtException", (error) => {
            logError("Uncaught exception.", error);
          });

          process.on("unhandledRejection", (reason) => {
            logError("Unhandled rejection.", reason);
          });

          async function main(): Promise<void> {
            const config = getConfig();

            log("info", "Starting MCP server.", {
              name: SERVER_NAME,
              version: SERVER_VERSION,
              integrationName: config.integrationName,
              integrationVersion: config.integrationVersion,
              node: process.version,
              tokenSource: config.tokenSource,
            });

            log("info", "Starting MCP stdio protocol negotiation.");
            await serveStdio(() => buildServer());
          }

          main().catch((error) => {
            logError(`Failed to start ${SERVER_NAME}.`, error);
            process.exit(1);
          });
          EOF

      - name: Apply major-version metadata
        run: |
          node <<'NODE'
          const fs = require('fs');

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = '4.0.0';
          pkg.engines = { node: '>=20' };
          pkg.dependencies = pkg.dependencies ?? {};
          pkg.dependencies.zod = '^4.0.0';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');

          const manifest = JSON.parse(fs.readFileSync('server.json', 'utf8'));
          manifest.version = '4.0.0';
          for (const entry of manifest.packages ?? []) entry.version = '4.0.0';
          fs.writeFileSync('server.json', JSON.stringify(manifest, null, 2) + '\n');

          const configPath = 'src/config.ts';
          const config = fs.readFileSync(configPath, 'utf8').replace(
            /export const SERVER_VERSION = "[^"]+";/,
            'export const SERVER_VERSION = "4.0.0";',
          );
          fs.writeFileSync(configPath, config);

          const changelogPath = 'CHANGELOG.md';
          const changelog = fs.readFileSync(changelogPath, 'utf8');
          if (!changelog.includes('## 4.0.0 - 2026-07-29')) {
            const entry = [
              '## 4.0.0 - 2026-07-29',
              '',
              '### Changed',
              '',
              '- Migrated to the stable MCP TypeScript SDK v2 package family.',
              '- Added stdio negotiation for MCP 2026-07-28 while retaining legacy client compatibility.',
              '- Raised the minimum supported Node.js version from 18 to 20.',
              '- Migrated tools, prompts, and resources to the v2 registration APIs and Zod 4 schemas.',
              '',
            ].join('\n');
            const marker = changelog.indexOf('\n## ');
            const updated = marker >= 0
              ? changelog.slice(0, marker + 1) + '\n' + entry + changelog.slice(marker + 1)
              : changelog + '\n' + entry;
            fs.writeFileSync(changelogPath, updated);
          }
          NODE

      - name: Install migrated dependencies
        run: npm install

      - name: Fail on unresolved codemod markers
        run: |
          if grep -R "@mcp-codemod-error" src tests package.json; then
            exit 1
          fi

      - name: Validate migration
        run: |
          npm run lint
          npm run build
          npm test

      - name: Commit generated migration
        run: |
          if git diff --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json server.json CHANGELOG.md src tests
          git commit -m "feat: support MCP protocol 2026-07-28 [mcp-v2-generated]"
          git push origin HEAD:feat/mcp-2026-07-28
