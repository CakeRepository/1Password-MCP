name: Release v3.0.0

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/release-v3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-and-publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate version alignment
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          SERVER_VERSION=$(node -p "require('./server.json').version")
          CONFIG_VERSION=$(node -e "const fs=require('fs'); const s=fs.readFileSync('./src/config.ts','utf8'); const m=s.match(/export const SERVER_VERSION = \"([^\"]+)\";/); if(!m){process.exit(1)}; console.log(m[1]);")

          echo "package.json version: ${PACKAGE_VERSION}"
          echo "server.json version: ${SERVER_VERSION}"
          echo "src/config.ts version: ${CONFIG_VERSION}"

          test "${PACKAGE_VERSION}" = "3.0.0"
          test "${PACKAGE_VERSION}" = "${SERVER_VERSION}"
          test "${PACKAGE_VERSION}" = "${CONFIG_VERSION}"

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Check if version already exists on npm
        id: npm_check
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "Version ${PACKAGE_VERSION} is already published."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "Version ${PACKAGE_VERSION} is not published yet."
          fi

      - name: Publish to npm
        if: steps.npm_check.outputs.already_published == 'false'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v3.0.0 >/dev/null 2>&1; then
            echo "Release v3.0.0 already exists."
          else
            gh release create v3.0.0 \
              --target "$GITHUB_SHA" \
              --title "v3.0.0" \
              --notes "Major security-focused release. password_read is now metadata-only unless reveal: true is explicitly supplied. Adds op_run and op_check_ref so agents can use and validate 1Password references without exposing plaintext secrets."
          fi
